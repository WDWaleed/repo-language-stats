[project]
name = "repo-language-stats"
version = "0.1.0"
description = "CLI tool to calculate aggregate programming-language statistics across a GitHub user's repositories"
readme = "README.md"
authors = [
    { name = "Waleed Ahmed", email = "0100waleedahmed0100@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "nbformat>=5.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
repo-language-stats = "repo_language_stats.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
